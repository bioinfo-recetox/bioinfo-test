name: Publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; never cancel one that's already running.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Pinned in exactly this one place. Keep in sync with the version
  # installed locally -- see MAINTENANCE.md > "Upgrade Quarto".
  QUARTO_VERSION: "1.10.18"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: ${{ env.QUARTO_VERSION }}

      # Only needed when we're actually going to deploy (push to main, or a
      # manual run) -- a pull-request run just renders, to catch breakage.
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Render site
        run: quarto render

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Non-blocking: reports broken links without failing the build.
  link-check:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: ${{ env.QUARTO_VERSION }}

      - name: Render site
        run: quarto render

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress './_site/**/*.html'
          fail: false
