project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "*/*.qmd"
    - "!legacy/"
  # Regenerates _generated/*.json from people.yml, projects.yml and
  # publications.bib before every render (see scripts/prepare-data.ts).
  # Runs via Quarto's bundled Deno -- no extra runtime needed.
  pre-render: scripts/prepare-data.ts
  resources:
    # media/projects/* is only ever referenced from inside client-side OJS
    # (projects.qmd renders <img> tags from JSON data at view time), so
    # Quarto's static reference scanner never sees a literal `<img src=...>`
    # for these files and won't copy them on its own -- list them explicitly.
    - "media/projects/"
    # _generated/ is derived output (see scripts/prepare-data.ts), not a
    # real project resource to copy wholesale.
    - "!_generated/"

# NOTE on Quarto version pinning: the version used to build this site locally
# and in CI must always match. It is pinned in ONE place, the QUARTO_VERSION
# env var in .github/workflows/publish.yml (added in a later step). Currently
# pinned to 1.10.18 locally; keep both in sync when upgrading (see MAINTENANCE.md).

website:
  title: "IB2: Integrative Bioinformatics and Biostatistics"
  description: "Integrative Bioinformatics and Biostatistics group @ RECETOX, Masaryk University"

  # Confirmed final URL: this repo will become bioinfo-recetox.github.io
  # itself (replacing the old Hugo one), served at the domain root.
  site-url: "https://bioinfo-recetox.github.io/"
  repo-url: "https://github.com/bioinfo-recetox/bioinfo-recetox.github.io"
  repo-actions: [edit, issue]
  favicon: media/site/icon.png
  navbar:
    logo: media/site/icon.svg
    left:
      - text: News
        href: news/index.qmd
      - text: Events
        href: events/index.qmd
      - text: Projects
        href: projects.qmd
      - text: People
        href: people.qmd
      - text: Downloads
        href: downloads.qmd
      - text: Publications
        href: publications.qmd
    right:
      - text: Contact
        href: contact.qmd

  page-footer:
    center: "© IB2 @ RECETOX, Masaryk University"

format:
  html:
    theme: [cosmo, styles.scss]
    toc: false
