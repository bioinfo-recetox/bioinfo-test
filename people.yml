- key: vladp
  name: Vlad Popovici
  role: Associate Professor of Computer Science
  group: PIs
  alumni: false
  photo: media/people/vladp.jpg
  bio: |
    Vlad Popovici is a professor of computer science at the Integrative Bioinformatics and Biostatistics
    group, RECETOX-MUNI. His research interests include computational pathology, pattern recognition and
    bioinformatics for biomarker discovery. For more than a decade, he applied his research in the
    field of oncology, especially in colorectal cancer.

    Currently, he focuses on spatially-resolved transcriptomics with the aim of discovering
    new connections between gene expression profiles and tumor morphology.
  interests:
    - Computational Pathology
    - Pattern Recognition
    - Bioinformatics for biomarker discovery
  education:
    - degree: PhD in Electrical Engineering
      institution: Ecole Polytechnique Federale de Lausanne (EPFL), CH.
      year: 2004
    - degree: MSc in Computer Science
      institution: Technical University of Cluj-Napoca, RO.
      year: 1999
    - degree: Eng in Computer Science
      institution: Technical University of Cluj-Napoca, RO.
      year: 1998
  links:
    email: vlad.popovici@recetox.muni.cz
    google_scholar: https://scholar.google.com/citations?user=hLJXAncAAAAJ&hl=en
    github: https://github.com/vladpopovici

