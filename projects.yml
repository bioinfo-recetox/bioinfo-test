- key: mercuric
  kind: research
  title: >
    MErCuRIC: A Phase Ia/b study of MEK1/2 inhibitor PD-0325901 or MEK-162 with
    cMET inhibitor PF-02341066 in RAS-MT and RAS-WT (with aberrant c-MET)
    colorectal cancer patients
  summary: Clinical trial for a cMET inhibitor.
  pi: Vlad Popovici (PI for MUNI)
  funding: EU-FP7 (Grant agreement ID 602901)
  tags: [horizon, crc, biomarkers]
  date: 2013-05-01
  image: media/projects/mercuric.png
  links:
    report: https://cordis.europa.eu/project/id/602901/reporting
  body: |
    ## Objective

    Colorectal cancer (CRC) is the 3rd most common cancer in Europe, and with
    approximately 200,000 deaths per year, it remains the 2nd most common cause of
    cancer death. More than half of all CRC patients develop distant metastases and
    have 5-year overall survival (OS) of less than 5% because of ineffective
    treatments. Increased understanding of cancer biology, coupled with the
    implementation of "omics"-based approaches, has revealed that cancer must be
    considered a heterogeneous disease. Historically, "one-size-fits-all"
    approaches have been standard practice in CRC treatment, but with the
    increased understanding of the molecular/genetic heterogeneity of CRC, it is
    clear that novel treatments must be developed and tested in selected subgroups
    to maximize the benefit of these new developments. MErCuRIC is a multicentre
    phase Ia/b clinical trial which assessed a novel therapeutic strategy (combined
    treatment of a MEK inhibitor PD-0325901 or MEK-162 with a MET inhibitor
    PF-02341066) to combat metastasis, improve survival and change current clinical
    practice for CRC patients with RAS mutant (MT) and RAS wild type (WT) (with
    aberrant c-MET) tumours. The consortium went beyond the state-of-the-art by (i)
    employing a novel treatment strategy targeting the biology of the disease and
    by (ii) using next generation sequencing (NGS) and 'xenopatients' to identify
    CRC patient subgroups who would maximally benefit from this novel treatment
    strategy.

    ## Results

    The PK analyses found that giving Binimetinib with Crizotinib did not affect
    the PK of Binimetinib compared to giving Binimetinib alone. A Phase Ib (dose
    expansion) study was undertaken with Binimetinib and Crizotinib with mCRC
    patients, with the aim of looking at three sub-groups of mCRC patients expected
    to respond to the therapy. Interim analyses found no clinical response in one
    sub-group, though PD results showed evidence of inhibition of the targeted
    molecular pathways. Recruitment to the remaining two sub-groups proved
    infeasible due to the rarity of patients.

